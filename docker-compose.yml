# docker compose up                     -> Fenrix on http://localhost:8000
# docker compose --profile llm up       -> also starts a local LLM for migration code
services:
  fenrix:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      FENRIX_OLLAMA_URL: http://ollama:11434
    volumes:
      - fenrix_data:/data

  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    volumes:
      - ollama_models:/root/.ollama
    # Pull the model once:  docker compose exec ollama ollama pull qwen2.5-coder:7b

volumes:
  fenrix_data:
  ollama_models:
